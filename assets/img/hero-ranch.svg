<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="JICO Ranch at golden hour">
  <title>JICO Ranch — hero placeholder</title>
  <!-- Placeholder hero. Replace with a real wide photo (same filename, or point
       .hero__bg in index.html at your .jpg). Deliberately text-free so it sits
       behind the headline cleanly. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8E7A5F"/>
      <stop offset="42%"  stop-color="#C6AE88"/>
      <stop offset="70%"  stop-color="#A99567"/>
      <stop offset="100%" stop-color="#5E6444"/>
    </linearGradient>
    <radialGradient id="sun" cx="72%" cy="30%" r="26%">
      <stop offset="0%"   stop-color="#F3E2C0" stop-opacity=".95"/>
      <stop offset="60%"  stop-color="#E4C89A" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#E4C89A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- distant treeline -->
  <path d="M0 470 Q 200 440 340 462 T 700 452 T 1080 466 T 1600 448 V 900 H0 Z" fill="#4E5738" opacity=".55"/>
  <!-- rolling pasture -->
  <path d="M0 560 Q 320 512 640 556 T 1240 548 T 1600 566 V 900 H0 Z" fill="#5A6640" opacity=".85"/>
  <path d="M0 682 Q 420 618 860 676 T 1600 662 V 900 H0 Z" fill="#43502F"/>
  <!-- fence line running into the field -->
  <g stroke="#2E2A22" stroke-width="5" opacity=".5" stroke-linecap="round">
    <path d="M60 760 V 690"/><path d="M258 742 V 678"/><path d="M446 726 V 668"/>
    <path d="M624 712 V 660"/><path d="M792 700 V 652"/><path d="M950 690 V 646"/>
    <path d="M60 714 H 950" stroke-width="4"/>
    <path d="M60 742 H 950" stroke-width="4"/>
  </g>
  <!-- foreground shadow so the headline has something to sit on -->
  <path d="M0 800 Q 500 754 1050 796 T 1600 786 V 900 H0 Z" fill="#333A24" opacity=".9"/>
</svg>
