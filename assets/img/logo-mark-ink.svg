<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 300 340" width="300" height="340" role="img" aria-label="JICO Ranch JR mark">
  <title>JICO Ranch — JR branding-iron mark</title>
  <!-- JR monogram built on ONE shared centre stem:
       · a horizontal bar runs left off the top of the stem — with the stem and
         the hook below, that reads as the J
       · the R's bowl leaves the top of the same stem, loops right and returns
         to it at mid-height; the leg kicks off that junction down to the right
       · the stem carries on past the bowl and curls into the J's hook
       · the R's leg finishes lowest; a wisp of smoke lifts off the top -->
  <g fill="none" stroke="#1A1714" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 -2 C118 -22 142 -30 130 -52" stroke-width="6" opacity=".4"/>
    <!-- top bar + shared stem + J hook -->
    <path d="M55 25 H160"/>
    <path d="M160 25 V200 A50 50 0 0 1 60 192"/>
    <!-- R bowl and leg, both off the same stem -->
    <path d="M160 25 H215 A48 48 0 0 1 215 121 H164"/>
    <path d="M166 116 L265 258"/>
  </g>
</svg>
